<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-repo" content="daedalus">
<meta name="app-version" content="1.0.0">
<meta name="theme-color" content="#03050b">
<title>DAEDALUS</title>
<style>
:root{
  --gold:#e9c46a; --gold-hi:#fff3cf; --gold-lo:#8a5a18;
  --ink:#03050b; --text:#ece3cc; --muted:#a9a08a;
  --display:"Trajan Pro","Copperplate","Copperplate Gothic Light","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#stage{position:fixed;inset:0;overflow:hidden;-webkit-overflow-scrolling:touch}
body.teaser #stage{overflow-y:auto}

/* ---------- title ---------- */
#hero{height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;
  transition:height 1.3s cubic-bezier(.7,0,.2,1)}
body.teaser #hero{height:44vh;height:44svh;min-height:250px}
.pre{font-family:var(--display);font-size:clamp(12px,3.4vw,18px);letter-spacing:.62em;padding-left:.62em;
  color:var(--gold);opacity:0;transform:translateY(8px);transition:opacity 1s .75s,transform 1s .75s}
#title{font-family:var(--display);font-weight:400;font-size:clamp(34px,11.6vw,104px);line-height:1.1;
  letter-spacing:.09em;padding-left:.09em;margin:.12em 0 .1em;white-space:nowrap;
  filter:drop-shadow(0 0 16px rgba(255,186,84,.5)) drop-shadow(0 3px 2px rgba(0,0,0,.9))}
#title span{display:inline-block;opacity:0;transform:translateY(.32em) scale(1.35);filter:blur(10px);
  color:var(--gold);
  background:
    linear-gradient(105deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 160% 0/300% 100% no-repeat,
    linear-gradient(180deg,#fff7d6 0%,#f6d476 30%,#c08a2e 55%,#f8df94 72%,#8a5a18 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  transition:opacity .7s,transform .9s cubic-bezier(.2,.8,.2,1),filter .7s;
  transition-delay:calc(var(--i)*70ms)}
.meander{width:min(78vw,520px);height:auto;margin-top:.5em;overflow:visible}
.meander path{fill:none;stroke:var(--gold);stroke-width:1.1;stroke-linecap:square;
  stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.5s .55s ease-out}
.tag{font-family:var(--body);font-style:italic;font-size:clamp(13px,3.7vw,18px);color:#d9cfb4;margin-top:1em;
  opacity:0;transition:opacity 1.1s 1.25s;text-shadow:0 1px 8px #000}
body.title .pre{opacity:.9;transform:none}
body.title #title span{opacity:1;transform:none;filter:blur(0);animation:shine 1.5s calc(.75s + var(--i)*55ms) ease-in-out both}
body.title .meander path{stroke-dashoffset:0}
body.title .tag{opacity:1}
@keyframes shine{from{background-position:160% 0,0 0}to{background-position:-60% 0,0 0}}

/* ---------- teaser ---------- */
#teaser{max-width:560px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 56px);
  visibility:hidden}
body.teaser #teaser{visibility:visible}
.kicker{font-family:var(--display);font-size:12px;letter-spacing:.42em;padding-left:.42em;text-align:center;
  color:var(--gold);margin-bottom:16px}
.feats{list-style:none;display:grid;gap:12px}
.feat{position:relative;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;
  padding:16px 16px 16px 14px;border-radius:4px;
  background:linear-gradient(135deg,rgba(18,22,34,.86),rgba(6,8,14,.9));
  border:1px solid rgba(233,196,106,.28);
  box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,235,180,.08)}
.feat::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;
  background:linear-gradient(180deg,transparent,var(--gold),transparent)}
.kicker,.feat,.tally,#replay{opacity:0;transform:translateY(22px);
  transition:opacity .8s,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(.75s + var(--n,0)*.16s)}
body.teaser .kicker,body.teaser .feat,body.teaser .tally,body.teaser #replay{opacity:1;transform:none}
.ico{width:56px;height:56px;color:var(--gold)}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.spin{transform-origin:24px 24px;animation:spin 14s linear infinite}
.spin.rev{animation-duration:22s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.num{font-family:var(--display);font-size:11px;letter-spacing:.3em;color:var(--gold);opacity:.8}
.feat h3{font-family:var(--display);font-weight:400;font-size:clamp(15px,4.4vw,19px);letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold-hi);margin:2px 0 5px;text-wrap:balance}
.feat p{font-family:var(--body);font-size:14.5px;line-height:1.45;color:var(--muted)}
.tally{font-family:var(--display);text-align:center;letter-spacing:.5em;padding-left:.5em;font-size:13px;
  color:var(--gold);margin:30px 0 18px}
#replay{display:block;margin:0 auto;font-family:var(--display);font-size:12px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold);background:rgba(8,10,16,.7);
  border:1px solid rgba(233,196,106,.4);border-radius:3px;padding:12px 20px;cursor:pointer}
#replay:active{background:rgba(233,196,106,.16)}
#replay:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  width:100%;border:0;background:radial-gradient(circle at 50% 46%,rgba(3,5,11,.25),rgba(3,5,11,.86) 70%);
  color:var(--gold);cursor:pointer;font-family:var(--display);transition:opacity .6s,visibility 0s .6s}
#gate .ring{position:relative;width:132px;height:132px;display:grid;place-items:center}
#gate svg{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:currentColor}
#gate .r1{transform-origin:50% 50%;animation:spin 40s linear infinite}
#gate .r2{transform-origin:50% 50%;animation:spin 26s linear infinite reverse}
#gate .halo{position:absolute;inset:14px;border-radius:50%;box-shadow:0 0 34px rgba(255,186,84,.45),inset 0 0 26px rgba(255,186,84,.25);animation:pulse 2.8s ease-in-out infinite}
#gate .go{font-size:17px;letter-spacing:.34em;padding-left:.34em;color:var(--gold-hi);text-shadow:0 0 14px rgba(255,186,84,.7)}
#gate .gk{font-size:11px;letter-spacing:.6em;padding-left:.6em;opacity:.7}
#gate:focus-visible .ring{outline:2px solid var(--gold);outline-offset:8px;border-radius:50%}
body.started #gate{opacity:0;visibility:hidden;pointer-events:none}
#ver{position:fixed;right:calc(env(safe-area-inset-right) + 8px);bottom:calc(env(safe-area-inset-bottom) + 6px);
  font:10px/1 ui-monospace,Menlo,monospace;color:rgba(233,196,106,.42);pointer-events:none;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
}

/* ---------- hub (trial cards are buttons now) ---------- */
.feats li{list-style:none}
button.feat{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button.feat:active{border-color:rgba(233,196,106,.8);background:linear-gradient(135deg,rgba(40,34,22,.9),rgba(12,10,8,.92))}
button.feat:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.feat .num,.feat .h3,.feat .p,.feat .pips{display:block}
.feat .h3{font-family:var(--display);font-weight:400;font-size:clamp(15px,4.4vw,19px);letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold-hi);margin:2px 0 5px;text-wrap:balance}
.feat .p{font-family:var(--body);font-size:14.5px;line-height:1.45;color:var(--muted)}
.feat .pips{display:flex;gap:7px;margin-top:10px;align-items:center}
.feat .pips i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(233,196,106,.55);display:block}
.feat .pips i.on{background:var(--gold);box-shadow:0 0 8px rgba(255,190,90,.8)}
.feat .pips b{font-family:var(--display);font-weight:400;font-size:10px;letter-spacing:.24em;color:var(--gold);margin-left:6px;text-transform:uppercase}
.feat.done{border-color:rgba(233,196,106,.7)}
.hubbtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;opacity:0;transform:translateY(22px);
  transition:opacity .8s,transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(.75s + var(--n,0)*.16s)}
body.teaser .hubbtns{opacity:1;transform:none}
.hubbtns button{font-family:var(--display);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);
  background:rgba(8,10,16,.7);border:1px solid rgba(233,196,106,.4);border-radius:3px;padding:12px 18px;cursor:pointer;
  opacity:1!important;transform:none!important;margin:0!important}
.hubbtns button:active{background:rgba(233,196,106,.16)}

/* ---------- play screen ---------- */
#game{position:fixed;inset:0;z-index:4;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 6px) 0 calc(env(safe-area-inset-bottom) + 10px);
  touch-action:none;-webkit-user-select:none;user-select:none}
body.playing #game{display:flex}
body.playing #stage,body.playing #stage #teaser{visibility:hidden}
body.playing #ver{bottom:auto;top:calc(env(safe-area-inset-top) + 6px)}
.gbar{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 4px}
#gback{width:48px;height:48px;font-size:30px;line-height:1;color:var(--gold);background:none;border:0;cursor:pointer;font-family:var(--body)}
#gback:active{color:var(--gold-hi)}
.gtitle{text-align:center;min-width:0}
.gnum{font-family:var(--display);font-size:11px;letter-spacing:.34em;padding-left:.34em;color:var(--gold);opacity:.85}
.gname{font-family:var(--display);font-size:clamp(13px,4vw,18px);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-hi);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 0 14px rgba(255,186,84,.45)}
.gpips{display:flex;justify-content:center;gap:2px;margin-top:2px}
.gpips button{width:30px;height:28px;background:none;border:0;padding:0;display:grid;place-items:center;cursor:pointer}
.gpips button i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(233,196,106,.6);display:block;transition:transform .2s}
.gpips button.on i{background:var(--gold);box-shadow:0 0 8px rgba(255,190,90,.8)}
.gpips button.cur i{transform:scale(1.45);border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(255,243,207,.25)}
.gpips button:disabled{opacity:.3;cursor:default}
.ggoal{font-family:var(--body);font-style:italic;font-size:13.5px;line-height:1.35;color:#d9cfb4;text-align:center;
  padding:4px 20px 2px;min-height:2.7em;text-shadow:0 1px 6px #000;text-wrap:balance}
.gwrap{flex:1;min-height:0;position:relative}
#play{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.gfoot{display:flex;justify-content:center;gap:10px;padding:8px 12px 0}
.gfoot button{flex:1;max-width:160px;font-family:var(--display);font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);background:rgba(8,10,16,.72);border:1px solid rgba(233,196,106,.4);border-radius:3px;padding:14px 6px;cursor:pointer}
.gfoot button:active{background:rgba(233,196,106,.16)}
.gfoot button:disabled{opacity:.32}
.gfoot button[hidden]{display:none}
#gback:focus-visible,.gpips button:focus-visible,.gfoot button:focus-visible,.hubbtns button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button{touch-action:manipulation}

/* ---------- the outer world ---------- */
#teaser{padding-left:0;padding-right:0}
#map{position:relative;margin:0 auto;overflow:hidden;border-top:1px solid rgba(233,196,106,.4);border-bottom:1px solid rgba(233,196,106,.4);
  opacity:0;transition:opacity 1.2s .5s;box-shadow:0 0 60px rgba(0,0,0,.7)}
body.teaser #map{opacity:1}
#mapc{display:block;width:100%}
#mapfxl,#nodes{position:absolute;inset:0;pointer-events:none}
.pt{position:absolute;border-radius:50%;opacity:0;animation:ptm linear infinite;will-change:transform,opacity}
@keyframes ptm{0%{transform:translate(0,0);opacity:0}15%{opacity:var(--o,.7)}85%{opacity:var(--o,.7)}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.node{position:absolute;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;padding:0;cursor:pointer;display:grid;place-items:center;
  pointer-events:auto;color:#e9c46a;background:radial-gradient(circle at 35% 30%,#1c2436,#070a12 75%);border:1.5px solid rgba(233,196,106,.8);
  box-shadow:0 4px 10px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,240,200,.18);transition:transform .25s,opacity .3s;-webkit-appearance:none;appearance:none}
.node svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.node.done{color:#3a2408;background:radial-gradient(circle at 35% 30%,#fff6d2,#e9b84e 55%,#9a6a1c);border-color:#fff3cf;
  box-shadow:0 0 14px rgba(255,200,90,.7),0 4px 10px rgba(0,0,0,.5)}
.node.cur{color:#fff3cf;border-color:#fff3cf;transform:translate(-50%,-50%) scale(1.14);animation:nodepulse 1.8s ease-in-out infinite}
@keyframes nodepulse{0%,100%{box-shadow:0 0 0 0 rgba(255,224,150,.8),0 4px 10px rgba(0,0,0,.6)}60%{box-shadow:0 0 0 15px rgba(255,224,150,0),0 4px 10px rgba(0,0,0,.6)}}
.node.lock{color:rgba(233,196,106,.5);border-color:rgba(233,196,106,.38);background:radial-gradient(circle at 35% 30%,rgba(28,36,54,.82),rgba(7,10,18,.86) 75%);cursor:default}
.node.god{width:70px;height:70px;border-width:2px}
.node.god svg{width:42px;height:42px;stroke-width:2.4}
.node.god.done{box-shadow:0 0 26px rgba(var(--gc),.95),0 0 64px rgba(var(--gc),.5)}
.node.nope{animation:nope .35s}
@keyframes nope{20%{margin-left:-5px}50%{margin-left:5px}80%{margin-left:-3px}}
.node:focus-visible{outline:2px solid #fff3cf;outline-offset:3px}
#marker{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:2;transition:transform .95s cubic-bezier(.5,0,.3,1)}
#marker i{position:absolute;left:-10px;top:-64px;width:20px;height:26px;animation:bob 1.3s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,224,150,.95))}
#marker.high i{top:-80px}
#marker i::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#fff,#ffd27a);clip-path:polygon(50% 100%,0 35%,22% 0,78% 0,100% 35%)}
@keyframes bob{50%{transform:translateY(-7px)}}
.tally{white-space:pre-line;line-height:2;padding-right:16px;padding-left:calc(16px + .5em)!important}
#mute{position:fixed;z-index:3;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 10px);width:42px;height:42px;border-radius:50%;
  display:none;place-items:center;color:var(--gold);background:rgba(6,8,14,.74);border:1px solid rgba(233,196,106,.5);cursor:pointer;padding:0}
body.teaser #mute{display:grid}
body.playing #mute{display:none}
#mute svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#mute .x{display:none}#mute.off .x{display:inline}#mute.off .w{display:none}#mute.off{color:rgba(233,196,106,.6)}
#mute:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* realm pips in the play header */
.gpips{gap:9px;margin-top:7px}
.gpips i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(233,196,106,.6);display:block}
.gpips i.on{background:var(--gold);box-shadow:0 0 8px rgba(255,190,90,.8)}
.gpips i.cur{transform:scale(1.5);border-color:var(--gold-hi);box-shadow:0 0 0 2px rgba(255,243,207,.25)}
.gnum{text-transform:uppercase}

/* ---------- meeting a god ---------- */
#god{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 20px);overflow:hidden;opacity:0;transition:opacity .45s;
  background:radial-gradient(circle at 50% 36%,rgba(var(--gc),.3),rgba(3,5,11,.95) 62%),rgba(3,5,11,.92)}
#god[hidden]{display:none}
#god.show{opacity:1}
.grays{position:absolute;left:50%;top:36%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;pointer-events:none;
  background:repeating-conic-gradient(rgba(var(--gc),.2) 0 3deg,transparent 3deg 12deg);
  -webkit-mask-image:radial-gradient(circle,#000 4%,transparent 46%);mask-image:radial-gradient(circle,#000 4%,transparent 46%);
  animation:spin 90s linear infinite}
#godemb{position:relative;width:min(44vw,190px);height:min(44vw,190px);color:#fff3cf;
  filter:drop-shadow(0 0 18px rgba(var(--gc),.95)) drop-shadow(0 0 44px rgba(var(--gc),.6))}
#godemb svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ggk{position:relative;font-family:var(--display);font-size:13px;letter-spacing:.6em;padding-left:.6em;color:rgb(var(--gc));margin-top:22px}
#godname{position:relative;font-family:var(--display);font-weight:400;font-size:clamp(34px,11vw,64px);letter-spacing:.1em;padding-left:.1em;line-height:1.15;color:#e9c46a;
  background:linear-gradient(180deg,#fff7d6,#f6d476 40%,#c08a2e 70%,#f8df94);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gtit{position:relative;font-family:var(--display);font-size:12px;letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;color:#d9cfb4;margin-top:6px}
.gsay{position:relative;font-family:var(--body);font-style:italic;font-size:clamp(16px,4.6vw,20px);line-height:1.5;color:#f1e8d0;max-width:30ch;margin:22px auto 0;text-wrap:balance}
#godgo{position:relative;margin-top:30px;font-family:var(--display);font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:#fff3cf;
  background:rgba(8,10,16,.6);border:1px solid rgba(233,196,106,.7);border-radius:3px;padding:15px 24px;cursor:pointer}
#godgo:active{background:rgba(233,196,106,.18)}
#godgo:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  #god.show #godemb svg *{stroke-dasharray:1;stroke-dashoffset:1;animation:gdraw 1.7s .25s ease-out forwards}
  #god .ggk,#god #godname,#god .gtit,#god .gsay,#god #godgo{opacity:0}
  #god.show .ggk,#god.show #godname,#god.show .gtit,#god.show .gsay,#god.show #godgo{animation:grise .8s ease-out forwards}
  #god.show .ggk{animation-delay:.9s}#god.show #godname{animation-delay:1.1s}#god.show .gtit{animation-delay:1.3s}
  #god.show .gsay{animation-delay:1.9s}#god.show #godgo{animation-delay:2.7s}
}
@keyframes gdraw{to{stroke-dashoffset:0}}
@keyframes grise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<main id="stage">
  <header id="hero">
    <div class="pre" lang="el">ΔΑΙΔΑΛΟΣ</div>
    <h1 id="title" aria-label="Daedalus"></h1>
    <svg class="meander" viewBox="0 0 221 6" aria-hidden="true"><path id="mpath" pathLength="1"/></svg>
    <p class="tag">The gods built riddles. Mortals built machines.</p>
  </header>

  <section id="teaser" aria-label="The ascent to Olympus">
    <div class="kicker">The ascent to Olympus</div>
    <div id="map">
      <canvas id="mapc" aria-hidden="true"></canvas>
      <div id="mapfxl" aria-hidden="true"></div>
      <div id="nodes"></div>
      <div id="marker" aria-hidden="true"><i></i></div>
    </div>
    <div class="tally" id="tally" style="--n:1"></div>
    <div class="hubbtns" style="--n:2">
      <button id="replay" type="button">Replay intro</button>
    </div>
  </section>
</main>
<button id="mute" type="button" aria-label="Sound is on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4z"/><path class="w" d="M15.5 9.5c1.3 1.4 1.3 3.6 0 5M18 7c2.8 2.8 2.8 7.2 0 10"/><path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>

<section id="game" aria-label="Puzzle">
  <header class="gbar">
    <button id="gback" type="button" aria-label="Back to the world">&#8249;</button>
    <div class="gtitle"><div class="gnum" id="gnum"></div><div class="gname" id="gname"></div><div class="gpips" id="gpips" aria-hidden="true"></div></div>
    <span></span>
  </header>

<script>
(()=>{
'use strict';
const TAU=Math.PI*2, cl=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,x)=>{x=cl((x-a)/(b-a));return x*x*(3-2*x)};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ---------- DOM bits ---------- */
const titleEl=document.getElementById('title');
[...'DAEDALUS'].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch;s.style.setProperty('--i',i);s.setAttribute('aria-hidden','true');titleEl.appendChild(s)});
{ // Greek-key band
  let d='';const n=34,w=6.5;
  for(let k=0;k<n;k++){const x=k*w;d+=`M${x} 6V0H${x+4.5}V6H${x+6.5}M${x+3} 4.3V1.6H${x+1.5}V4.4`}
  document.getElementById('mpath').setAttribute('d',d);
}
const stage=document.getElementById('stage');

/* ---------- canvas ---------- */
const cv=document.getElementById('fx'), g=cv.getContext('2d');
let W=0,H=0,DPR=1,U=0,CX=0,CY=0, gears=[], sheen=null;
const MECH=0.92, ZMAX=1.28;
const SPEC=[ // r, teeth, parent, theta(deg), spokes, omega(if root)
  {r:.300,n:96,p:-1,sp:4,w:.34,letters:true},
  {r:.118,n:38,p:0,th:-38,sp:5},
  {r:.150,n:48,p:0,th:148,sp:6},
  {r:.090,n:29,p:0,th:72,sp:3},
  {r:.068,n:22,p:1,th:-112,sp:0},
  {r:.104,n:36,p:-1,sp:0,w:-.9,top:true}
];

function gearSprite(R,teeth,spokes,pal,seed,letters,depth){
  const pad=3,S=Math.ceil(R*2+pad*2),c=document.createElement('canvas');c.width=c.height=S;
  const x=c.getContext('2d'),rnd=rng(seed);x.translate(S/2,S/2);
  const root=R*(1-(depth||Math.min(.09,2.2/teeth)));
  x.beginPath();
  for(let i=0;i<teeth;i++){const a=i/teeth*TAU,b=(i+.5)/teeth*TAU;x.lineTo(Math.cos(a)*root,Math.sin(a)*root);x.lineTo(Math.cos(b)*R,Math.sin(b)*R)}
  x.closePath();
  let gr=x.createRadialGradient(-R*.25,-R*.3,R*.05,0,0,R*1.02);
  pal.body.forEach((c,i)=>gr.addColorStop(pal.stops[i],c));x.fillStyle=gr;x.fill();
  x.globalCompositeOperation='source-atop';
  // surface mottling
  for(let i=0;i<pal.blots;i++){const a=rnd()*TAU,d=Math.sqrt(rnd())*R,br=R*(.04+rnd()*.16);
    const bx=Math.cos(a)*d,by=Math.sin(a)*d,col=pal.blot[(rnd()*pal.blot.length)|0];
    const bg=x.createRadialGradient(bx,by,0,bx,by,br);bg.addColorStop(0,col);bg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=bg;x.beginPath();x.arc(bx,by,br,0,TAU);x.fill()}
  // engraved rings
  const ring=(r,w,c)=>{x.beginPath();x.arc(0,0,r,0,TAU);x.lineWidth=w;x.strokeStyle=c;x.stroke()};
  const lw=Math.max(1,R*.012);
  [.93,.80,.74].forEach(f=>{if(f*R<root){ring(f*R,lw,'rgba(0,0,0,.42)');ring(f*R+lw*.9,lw*.6,pal.hi)}});
  // scale ticks + letters
  if(letters){
    x.strokeStyle='rgba(0,0,0,.5)';x.lineWidth=lw*.8;
    for(let i=0;i<120;i++){const a=i/120*TAU,r0=R*(i%5?.895:.875),r1=R*.925;x.beginPath();x.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);x.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);x.stroke()}
    const L='ΑΒΓΔΕΖΗΘΙΚΛΜΝΞΟΠΡΣΤΥΦΧΨΩ';x.font=`${R*.058}px Georgia,serif`;x.textAlign='center';x.textBaseline='middle';
    for(let i=0;i<24;i++){x.save();x.rotate(i/24*TAU);x.translate(0,-R*.838);x.fillStyle=pal.hi;x.fillText(L[i],.8,.8);x.fillStyle='rgba(0,0,0,.6)';x.fillText(L[i],0,0);x.restore()}
  }
  // spoke windows
  const hub=R*(spokes?.26:.0),rim=R*(letters?.72:.70),hw=R*(letters?.085:.075);
  if(spokes){
    const win=()=>{x.beginPath();for(let k=0;k<spokes;k++){const a0=k/spokes*TAU,a1=(k+1)/spokes*TAU,go=Math.asin(hw/rim),gi=Math.asin(hw/hub);
      x.moveTo(Math.cos(a0+go)*rim,Math.sin(a0+go)*rim);x.arc(0,0,rim,a0+go,a1-go);x.arc(0,0,hub,a1-gi,a0+gi,true);x.closePath()}};
    x.globalCompositeOperation='destination-out';win();x.fillStyle='#000';x.fill();
    x.globalCompositeOperation='source-atop';win();x.lineJoin='round';
    x.lineWidth=R*.05;x.strokeStyle='rgba(0,0,0,.38)';x.stroke();
    x.lineWidth=Math.max(1,R*.012);x.strokeStyle=pal.hi;x.stroke();
  }
  // hub
  const hr=R*(spokes?.17:.3);
  gr=x.createRadialGradient(-hr*.3,-hr*.35,0,0,0,hr);gr.addColorStop(0,pal.body[0]);gr.addColorStop(.7,pal.body[1]);gr.addColorStop(1,pal.body[2]);
  x.fillStyle=gr;x.beginPath();x.arc(0,0,hr,0,TAU);x.fill();ring(hr,lw,'rgba(0,0,0,.5)');
  if(!spokes){ring(R*.62,lw,'rgba(0,0,0,.4)');ring(R*.62+lw,lw*.6,pal.hi);
    for(let i=0;i<8;i++){const a=i/8*TAU;x.beginPath();x.arc(Math.cos(a)*R*.46,Math.sin(a)*R*.46,R*.035,0,TAU);x.fillStyle='rgba(0,0,0,.45)';x.fill()}}
  const q=Math.max(2,R*.045);x.fillStyle='rgba(10,6,2,.85)';x.fillRect(-q,-q,q*2,q*2);
  return c;
}
const GOLD={body:['#fff4c8','#ecc057','#b17b23','#4d2d0c'],stops:[0,.34,.74,1],blots:26,
  blot:['rgba(255,250,220,.22)','rgba(120,70,10,.22)','rgba(255,210,120,.18)'],hi:'rgba(255,240,196,.5)'};
const PATINA={body:['#a9d9c6','#4e9a89','#27595a','#0d2226'],stops:[0,.3,.72,1],blots:70,
  blot:['rgba(98,64,28,.5)','rgba(160,226,206,.32)','rgba(16,44,48,.5)','rgba(134,92,40,.4)'],hi:'rgba(190,236,220,.3)'};

function build(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  U=Math.min(W,H*.92);CX=W/2;CY=H*(W<H?.46:.5);
  const k=U*MECH*ZMAX*DPR;
  gears=SPEC.map((s,i)=>{const R=s.r*k,o={...s,R:s.r*U*MECH,a:0};
    o.gold=gearSprite(R,s.n,s.sp,GOLD,11+i,s.letters);o.pat=gearSprite(R,s.n,s.sp,PATINA,71+i,s.letters);
    o.sc=document.createElement('canvas');o.sc.width=o.sc.height=o.gold.width;o.sx=o.sc.getContext('2d');
    const S=o.gold.width;
    if(o.sx.createConicGradient){const cg=o.sx.createConicGradient(-.9,S/2,S/2);
      [[0,'rgba(255,255,255,.34)'],[.11,'rgba(255,255,255,0)'],[.25,'rgba(0,0,0,.32)'],[.39,'rgba(0,0,0,0)'],
       [.5,'rgba(255,255,255,.26)'],[.61,'rgba(255,255,255,0)'],[.75,'rgba(0,0,0,.32)'],[.89,'rgba(0,0,0,0)'],[1,'rgba(255,255,255,.34)']]
       .forEach(([p,c])=>cg.addColorStop(p,c));o.sheen=cg}
    else{const lg=o.sx.createLinearGradient(0,0,S,S);lg.addColorStop(0,'rgba(255,255,255,.3)');lg.addColorStop(.5,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(0,0,0,.35)');o.sheen=lg}
    return o});
  gears.forEach(o=>{if(o.p>=0){const p=gears[o.p],th=o.th*Math.PI/180,d=(p.R+o.R)*.955;o.th=th;
    o.x=p.x+Math.cos(th)*d;o.y=p.y+Math.sin(th)*d}else{o.x=0;o.y=0}});
}

/* ---------- particles / stars / maze ---------- */
const pr=rng(5), motes=Array.from({length:80},()=>({x:pr(),y:pr(),s:.5+pr()*1.8,v:.01+pr()*.035,p:pr()*TAU,d:pr()}));
const stars=Array.from({length:130},()=>({x:pr(),y:pr()*.8,s:.4+pr()*1.2,p:pr()*TAU,f:.6+pr()*2}));
const sparks=Array.from({length:30},()=>({a:pr()*TAU,v:.25+pr()*.9,l:.03+pr()*.07}));
const mr=rng(23), maze=Array.from({length:7},(_,k)=>{const n=1+(k>1)+(k>4),o=mr()*TAU;
  return{gaps:Array.from({length:n},(_,i)=>o+i*TAU/n+mr()*.5),walls:Array.from({length:2+(k>2)},()=>mr()*TAU)}});

/* ---------- drawing ---------- */
function drawGear(o,gm,alpha,z){
  const S=o.sc.width,x=o.sx;
  x.globalCompositeOperation='copy';x.globalAlpha=1;
  x.setTransform(1,0,0,1,S/2,S/2);x.rotate(o.a);
  x.drawImage(gm>=1?o.gold:o.pat,-S/2,-S/2);
  if(gm>0&&gm<1){x.globalCompositeOperation='source-atop';x.globalAlpha=gm;x.drawImage(o.gold,-S/2,-S/2);x.globalAlpha=1}
  x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-atop';x.fillStyle=o.sheen;x.globalAlpha=.45+.55*gm;x.fillRect(0,0,S,S);
  const px=CX+o.x*z,py=CY+o.y*z,R=o.R*z,D=S/(DPR*ZMAX)*z;
  // soft drop shadow
  const sh=g.createRadialGradient(px+R*.06,py+R*.09,R*.55,px+R*.06,py+R*.09,R*1.12);
  sh.addColorStop(0,`rgba(0,0,0,${.55*alpha})`);sh.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=sh;g.beginPath();g.arc(px+R*.06,py+R*.09,R*1.12,0,TAU);g.fill();
  g.globalAlpha=alpha;g.drawImage(o.sc,px-D/2,py-D/2,D,D);g.globalAlpha=1;
}
function glow(x,y,r,c0,c1){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c0);gr.addColorStop(1,c1||'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}

function minotaur(g,s,eye,a){
  g.save();g.scale(s,s);g.globalAlpha=a;g.lineJoin='round';
  const rim='rgba(255,128,60,.75)';
  for(const sx of[-1,1]){g.save();g.scale(sx,1);
    g.beginPath();g.moveTo(.50,-.22);g.lineTo(.90,-.36);g.lineTo(.54,-.02);g.closePath();g.fillStyle='#0b0504';g.fill();g.lineWidth=.022;g.strokeStyle=rim;g.stroke();
    g.beginPath();g.moveTo(.44,-.22);g.bezierCurveTo(.98,-.34,1.0,-.82,.72,-1.10);g.bezierCurveTo(.76,-.72,.56,-.50,.20,-.44);g.closePath();
    const hg=g.createLinearGradient(.3,-.3,.74,-1.08);hg.addColorStop(0,'#140a07');hg.addColorStop(.55,'#6e5a44');hg.addColorStop(1,'#efe2c0');
    g.fillStyle=hg;g.fill();g.lineWidth=.02;g.strokeStyle='rgba(255,170,100,.55)';g.stroke();g.restore()}
  g.beginPath();g.moveTo(-.44,-.40);g.quadraticCurveTo(0,-.58,.44,-.40);g.lineTo(.52,-.06);g.quadraticCurveTo(.40,.36,.27,.60);
  g.quadraticCurveTo(.23,.87,0,.89);g.quadraticCurveTo(-.23,.87,-.27,.60);g.quadraticCurveTo(-.40,.36,-.52,-.06);g.closePath();
  const fg=g.createLinearGradient(0,-.5,0,.9);fg.addColorStop(0,'#1c0d09');fg.addColorStop(1,'#050202');g.fillStyle=fg;g.fill();
  g.lineWidth=.026;g.strokeStyle=rim;g.stroke();
  g.beginPath();g.ellipse(0,.68,.2,.14,0,0,TAU);g.fillStyle='#22110c';g.fill();
  for(const sx of[-1,1]){g.beginPath();g.ellipse(sx*.085,.70,.035,.05,sx*.4,0,TAU);g.fillStyle=`rgba(255,${60+eye*60|0},20,${.25+eye*.6})`;g.fill()}
  g.beginPath();g.arc(0,.80,.115,.12*Math.PI,.88*Math.PI);g.lineWidth=.035;g.strokeStyle='#e9c46a';g.stroke();
  g.globalCompositeOperation='lighter';
  for(const sx of[-1,1]){const ex=sx*.22,ey=-.03;
    {const gr=g.createRadialGradient(ex,ey,0,ex,ey,.34);gr.addColorStop(0,`rgba(255,50,10,${.55*eye})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(ex,ey,.34,0,TAU);g.fill()}
    g.beginPath();g.ellipse(ex,ey,.105,.042,sx*.38,0,TAU);g.fillStyle=`rgba(255,90,30,${eye})`;g.fill();
    g.beginPath();g.ellipse(ex,ey,.05,.018,sx*.38,0,TAU);g.fillStyle=`rgba(255,240,190,${eye})`;g.fill()}
  g.restore();
}

let t0=performance.now(), last=t0, spin=0, phase=0, waiting=true;
function frame(now){
  requestAnimationFrame(frame);
  const t=waiting?.55:(now-t0)/1000, dt=Math.min(.05,(now-last)/1000);last=now;
  if(!W)return;
  if(scene){gameBg(now/1000,dt);return}
  if(phase>=2&&worldCovers())return;
  // timeline weights
  const wD=sm(6.86,7.0,t), wC=sm(4.92,5.08,t)*(1-wD), wA=1-wC-wD;
  const awake=sm(1.7,2.7,t);
  spin+=dt*(.06+.94*sm(1.3,3.2,t))*(t>7?.55:1);
  g.setTransform(DPR,0,0,DPR,0,0);g.globalCompositeOperation='source-over';g.globalAlpha=1;

  // --- background
  const mix=(a,c,d)=>a.map((v,i)=>Math.round(v*wA+c[i]*wC+d[i]*wD));
  const top=mix([9,46,68],[46,7,4],[12,14,40]),bot=mix([1,5,10],[3,0,0],[2,2,8]);
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,`rgb(${top})`);bg.addColorStop(.75,`rgb(${bot})`);
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';
  if(wD>0){ // night sky
    for(const s of stars){const a=wD*(.35+.65*Math.abs(Math.sin(t*s.f+s.p)));g.fillStyle=`rgba(255,244,220,${a*.8})`;g.fillRect(s.x*W,s.y*H,s.s,s.s)}
    glow(CX,H*.5,U*.9,`rgba(255,170,70,${.10*wD})`);
  }
  if(wA>0){ // sunlight through water
    for(let i=0;i<6;i++){const x0=W*(.08+i*.17),dx=W*.22+Math.sin(t*.3+i)*W*.05,w=W*(.035+.02*((i*7)%3));
      const a=wA*sm(0,1.2,t)*(.05+.045*Math.sin(t*.7+i*1.9));if(a<=0)continue;
      const rg=g.createLinearGradient(0,0,0,H*.95);rg.addColorStop(0,`rgba(140,225,235,${a*1.6})`);rg.addColorStop(1,'rgba(140,225,235,0)');
      g.fillStyle=rg;g.beginPath();g.moveTo(x0-w*.3,-5);g.lineTo(x0+w*.3,-5);g.lineTo(x0+dx+w*2.4,H*.95);g.lineTo(x0+dx-w*2.4,H*.95);g.fill()}
  }
  g.globalCompositeOperation='source-over';

  // --- the mechanism
  const z=t<5?lerp(.86,1.06,cl(t/5)):ZMAX-.04+.04*Math.sin(t*.2);
  const mA=t<5?sm(.15,1.5,t):.5*sm(6.9,7.6,t)*(1-.3*sm(9.2,10.6,t));
  if(mA>.003){
    for(const o of gears){
      if(o.p<0)o.a=spin*o.w;
      else{const p=gears[o.p];o.a=o.th+Math.PI+Math.PI/o.n-(p.a-o.th)*p.n/o.n}
    }
    const gm=t<5?awake:1;
    for(const i of[2,3,4,1,0,5])drawGear(gears[i],gm,mA,z);
    if(t<5.2){ // sun & moon pointers
      const pa=mA*(.35+.65*awake);g.lineCap='round';
      const hand=(ang,len,w,col,tip)=>{const x=CX+Math.cos(ang)*len*z,y=CY+Math.sin(ang)*len*z;
        g.globalAlpha=pa;g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=w*1.2;g.beginPath();g.moveTo(CX+3,CY+4);g.lineTo(x+3,y+4);g.stroke();
        g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(CX,CY);g.lineTo(x,y);g.stroke();tip(x,y);g.globalAlpha=1};
      hand(spin*.55-1.2,U*MECH*.275,U*.007,'#f3d58a',(x,y)=>{g.fillStyle='#ffe9a8';g.beginPath();g.arc(x,y,U*.016,0,TAU);g.fill();
        g.globalCompositeOperation='lighter';glow(x,y,U*.06,`rgba(255,200,90,${.6*awake})`);g.globalCompositeOperation='source-over'});
      hand(-spin*1.3+.7,U*MECH*.2,U*.005,'#d9dde2',(x,y)=>{const r=U*.014;g.fillStyle='#e9edf2';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
        g.fillStyle='#14161c';g.beginPath();g.arc(x,y,r,-Math.PI/2,Math.PI/2);g.fill()});
      g.fillStyle='#2a1a08';g.beginPath();g.arc(CX,CY,U*.014,0,TAU);g.fill();
    }
    // awakening shockwave
    const sw=(t-1.9)/1.1;
    if(sw>0&&sw<1){g.globalCompositeOperation='lighter';g.lineWidth=U*.03*(1-sw);g.strokeStyle=`rgba(255,214,130,${.7*(1-sw)})`;
      g.beginPath();g.arc(CX,CY,U*(.05+sw*.75),0,TAU);g.stroke();glow(CX,CY,U*.5,`rgba(255,200,110,${.35*Math.sin(sw*Math.PI)})`);g.globalCompositeOperation='source-over'}
    if(t>6.8){g.fillStyle=`rgba(2,3,10,${.62*wD})`;glow(CX,H*.5,U*.75,`rgba(2,3,10,${.7*wD})`)}
  }

  // --- Archimedes' beam
  if(t>2.6&&t<5.4){
    const P=[[CX-U*.72,CY-U*.80],[CX+U*.36,CY-U*.52],[CX-U*.39,CY-U*.20],[CX+U*.36,CY+U*.45],[CX,CY]];
    const ma=sm(2.6,3.1,t)*(1-sm(5.0,5.3,t));
    for(let i=1;i<4;i++){const[ax,ay]=P[i-1],[bx,by]=P[i],[cx2,cy2]=P[i+1];
      let d1x=ax-bx,d1y=ay-by,d2x=cx2-bx,d2y=cy2-by;const l1=Math.hypot(d1x,d1y),l2=Math.hypot(d2x,d2y);
      const nx=d1x/l1+d2x/l2,ny=d1y/l1+d2y/l2;
      g.save();g.translate(bx,by);g.rotate(Math.atan2(ny,nx));g.globalAlpha=ma;
      const mg=g.createLinearGradient(0,-U*.07,0,U*.07);mg.addColorStop(0,'#fff6d8');mg.addColorStop(.45,'#d79d3a');mg.addColorStop(1,'#5a3610');
      g.beginPath();g.ellipse(-U*.008,0,U*.02,U*.07,0,0,TAU);g.fillStyle='#2c1a08';g.fill();
      g.beginPath();g.ellipse(0,0,U*.02,U*.07,0,0,TAU);g.fillStyle=mg;g.fill();g.lineWidth=1.2;g.strokeStyle='#ffeab0';g.stroke();g.restore()}
    const seg=[];let tot=0;for(let i=0;i<4;i++){const l=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);seg.push(l);tot+=l}
    let len=cl((t-3.1)/1.15)*tot;const ba=1-sm(5.0,5.25,t);
    if(len>0&&ba>0){
      g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
      g.beginPath();g.moveTo(P[0][0],P[0][1]);let hx=P[0][0],hy=P[0][1];
      for(let i=0;i<4&&len>0;i++){const f=Math.min(1,len/seg[i]);hx=lerp(P[i][0],P[i+1][0],f);hy=lerp(P[i][1],P[i+1][1],f);g.lineTo(hx,hy);
        if(f>=1&&i<3)g.moveTo(P[i+1][0],P[i+1][1])||0;len-=seg[i]}
      const fl=.85+.15*Math.sin(t*40);

      g.lineWidth=U*.018;g.strokeStyle=`rgba(255,214,130,${.32*ba*fl})`;g.stroke();
      g.lineWidth=U*.005;g.strokeStyle=`rgba(255,252,240,${.95*ba})`;g.stroke();
      for(let i=1;i<4;i++){const hit=sm(0,.12,t-(3.1+1.15*seg.slice(0,i).reduce((a,b)=>a+b,0)/tot));if(hit>0)glow(P[i][0],P[i][1],U*.11,`rgba(255,236,180,${.75*hit*ba})`)}

      if(burn>0){glow(CX,CY,U*(.1+burn*.75),`rgba(255,235,180,${.95*burn})`,'rgba(255,120,20,0)');

  // --- the labyrinth & its tenant
  if(t>4.95&&t<7.0){
    const tc=t-5, a=sm(5.0,5.25,t)*(1-sm(6.78,6.95,t)), zc=1+2.0*Math.pow(cl(tc/1.95),2.2);

    g.lineWidth=U*.022/Math.sqrt(zc);g.strokeStyle=`rgba(255,80,20,${.20*a})`;g.stroke();
    g.lineWidth=U*.0065/Math.sqrt(zc);g.strokeStyle=`rgba(255,196,130,${.95*a})`;g.stroke();
    g.restore();g.globalCompositeOperation='source-over';
    const ma=sm(5.55,6.05,t)*a;
    if(ma>0){g.fillStyle=`rgba(0,0,0,${.8*ma})`;g.beginPath();g.arc(0,0,U*.092,0,TAU);g.fill();

    const a=(.25+.75*Math.abs(Math.sin(t*1.3+m.p)))*(.25+.5*m.d)*sm(0,1,t);
    g.fillStyle=`rgba(${mc},${a})`;g.beginPath();g.arc((m.x+Math.sin(t*.4+m.p)*.012)*W,m.y*H,m.s*(.6+m.d),0,TAU);g.fill()}

  const sl=(t-6.7)/.3;
  if(sl>0&&sl<1.6){const p=cl(sl),x0=-W*.1,y0=CY+U*.4,x1=W*1.1,y1=CY-U*.4,hx=lerp(x0,x1,p),hy=lerp(y0,y1,p),
      tx=lerp(x0,x1,cl(sl-.45)),ty=lerp(y0,y1,cl(sl-.45)),nx=-(y1-y0),ny=x1-x0,nl=Math.hypot(nx,ny),w=U*.012;
    g.fillStyle=`rgba(255,248,225,${cl(1.6-sl)})`;g.beginPath();g.moveTo(tx,ty);

  g.globalCompositeOperation='source-over';

  // --- flashes, vignette, fade-in
  const f1=sm(4.55,5.0,t)*(1-sm(5.0,5.7,t)), f2=.75*sm(6.8,6.92,t)*(1-sm(6.92,7.5,t));
  if(f1>0){g.fillStyle=`rgba(255,244,214,${f1})`;g.fillRect(0,0,W,H)}
  if(f2>0){g.fillStyle=`rgba(255,236,196,${f2})`;g.fillRect(0,0,W,H)}

  if(!waiting&&phase<1&&t>=6.93){phase=1;document.body.classList.add('title')}
  if(!waiting&&phase<2&&t>=9.3){phase=2;document.body.classList.add('teaser');hubOpen()}
}

/* ===== DAEDALUS puzzle rules: pure logic, shared by the game and the level generator ===== */
const Rules=(()=>{
const DX=[0,1,0,-1],DY=[-1,0,1,0]; // 0 N, 1 E, 2 S, 3 W ; 4 = wait

/* ---------- I. Antikythera: gears on pegs ---------- */
const GR=[.8,1.2,1.6],GN=[16,24,32],EPS=.04;
const gear={
  GR,GN,EPS,
  init(L){return{pl:L.pegs.map(()=>-1)}},
  list(L,s){
    const a=L.fx.map((f,i)=>({x:f[0],y:f[1],r:GR[f[2]],z:f[2],k:f[3],req:f[4]||0,peg:-1,fi:i}));
    s.pl.forEach((z,i)=>{if(z>=0)a.push({x:L.pegs[i][0],y:L.pegs[i][1],r:GR[z],z,k:'p',req:0,peg:i,fi:-1})});
    return a},
  left(L,s){const c=L.tray.slice();s.pl.forEach(z=>{if(z>=0)c[z]--});return c},
  fits(L,s,i,z){
    if(s.pl[i]>=0)return false;const x=L.pegs[i][0],y=L.pegs[i][1],r=GR[z];
    return gear.list(L,s).every(o=>Math.hypot(o.x-x,o.y-y)>=o.r+r-EPS)},
  run(L,s){
    const G=gear.list(L,s),n=G.length,adj=G.map(()=>[]);
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const d=Math.hypot(G[i].x-G[j].x,G[i].y-G[j].y);
      if(Math.abs(d-(G[i].r+G[j].r))<=EPS){adj[i].push(j);adj[j].push(i)}}
    const dir=new Array(n).fill(0),par=new Array(n).fill(-1),order=[];let jam=false;
    const d0=G.findIndex(q=>q.k==='D');dir[d0]=1;const q=[d0];
    while(q.length){const c=q.shift();order.push(c);for(const b of adj[c]){
      if(!dir[b]){dir[b]=-dir[c];par[b]=c;q.push(b)}else if(dir[b]===dir[c])jam=true}}
    return{G,adj,dir,par,order,jam}},
  solved(L,s,R){R=R||gear.run(L,s);if(R.jam)return false;
    return R.G.every((q,i)=>q.k!=='T'||(R.dir[i]!==0&&(!q.req||R.dir[i]===q.req)))}
};

/* ---------- II. Labyrinth: Theseus and the Minotaur ---------- */
const maze={
  wall(L,x,y){return parseInt(L.g[y*L.w+x],16)},
  open(L,x,y,d){const nx=x+DX[d],ny=y+DY[d];return nx>=0&&ny>=0&&nx<L.w&&ny<L.h&&!(maze.wall(L,x,y)>>d&1)},
  init(L){return{t:[L.t[0],L.t[1]],m:[L.m[0],L.m[1]],dead:false,won:false}},
  step(L,s,d,tame){
    if(s.dead||s.won)return null;
    let tx=s.t[0],ty=s.t[1],mx=s.m[0],my=s.m[1];
    if(d<4){if(!maze.open(L,tx,ty,d))return null;tx+=DX[d];ty+=DY[d]}
    const n={t:[tx,ty],m:[mx,my],dead:false,won:false},mp=[];
    if(tame){if(tx===L.e[0]&&ty===L.e[1])n.won=true;return{s:n,mp}}
    if(tx===mx&&ty===my){n.dead=true;return{s:n,mp}}
    if(tx===L.e[0]&&ty===L.e[1]){n.won=true;return{s:n,mp}}
    for(let i=0;i<2;i++){
      const hx=Math.sign(tx-mx),hy=Math.sign(ty-my);
      if(hx&&maze.open(L,mx,my,hx>0?1:3))mx+=hx;
      else if(hy&&maze.open(L,mx,my,hy>0?2:0))my+=hy;
      mp.push([mx,my]);
      if(mx===tx&&my===ty){n.dead=true;break}
    }
    n.m=[mx,my];return{s:n,mp}},
  key:s=>s.t[0]+','+s.t[1]+','+s.m[0]+','+s.m[1],
  moves:[0,1,2,3,4]
};

/* ---------- III. Archimedes: mirrors ---------- */
const mir={
  mirrors(L){const M=[];for(let i=0;i<L.g.length;i++){const c=L.g[i];if(c==='a'||c==='b')M.push(i)}return M},
  init(L){return{o:mir.mirrors(L).map(i=>L.g[i]==='a'?0:1)}},
  trace(L,s){
    const M=mir.mirrors(L),idx={};M.forEach((c,i)=>idx[c]=i);
    const lit={},hits={},beams=[],used={};
    for(const[sx,sy,sd]of L.src){
      let x=sx,y=sy,d=sd,n=0;const pts=[[sx-DX[sd],sy-DY[sd]]];let end='out';
      while(n++<600){
        if(x<0||y<0||x>=L.w||y>=L.h){pts.push([x-DX[d]*.5,y-DY[d]*.5]);end='out';break}
        const i=y*L.w+x,c=L.g[i];
        if(c==='#'){pts.push([x-DX[d]*.5,y-DY[d]*.5]);end='rock';break}
        if(c>='1'&&c<='9'){hits[i]=(hits[i]||0)+1;pts.push([x,y]);end='ship';break}
        if(c==='o')lit[i]=1;
        if(i in idx){used[idx[i]]=1;pts.push([x,y]);d=(s.o[idx[i]]?[3,2,1,0]:[1,0,3,2])[d]}
        x+=DX[d];y+=DY[d];
      }
      beams.push({pts,end});
    }
    return{lit,hits,beams,used}},
  solved(L,s,tr){tr=tr||mir.trace(L,s);
    for(let i=0;i<L.g.length;i++){const c=L.g[i];
      if(c==='o'&&!tr.lit[i])return false;
      if(c>='1'&&c<='9'&&(tr.hits[i]||0)<+c)return false}
    return true}
};

    for(let i=0;i<3;i++){c.fillStyle=['#e6dfcd','#d2cab6','#bdb5a0'][i];c.fillRect(0,yb-30+i*10,w,10)}
    c.strokeStyle='rgba(60,54,40,.35)';c.lineWidth=1;c.beginPath();for(let i=1;i<3;i++){c.moveTo(0,yb-30+i*10+.5);c.lineTo(w,yb-30+i*10+.5)}c.stroke();
  },
  // VI. Olympus
  (c,w,yt,yb,r)=>{
    c.fillStyle=lin(c,0,yb,0,yt,[[0,'#182050'],[.5,'#090c26'],[1,'#02030c']]);c.fillRect(0,yt,w,yb-yt);starfield(c,w,yt,yb-60,r,170,1);
    const G5=WD.pts[LAST],py=G5.y+46;
    c.globalCompositeOperation='lighter';c.fillStyle=rad(c,G5.x,G5.y-10,0,w*.7,[[0,'rgba(255,244,200,.34)'],[.5,'rgba(150,160,255,.1)'],[1,'rgba(0,0,0,0)']]);c.fillRect(0,yt,w,yb-yt);
    for(const bx of[w*.14,w*.86]){c.beginPath();let qx=bx,qy=yt+10;c.moveTo(qx,qy);for(let i=0;i<7;i++){qx+=(r()-.5)*36;qy+=20+r()*18;c.lineTo(qx,qy)}
      c.lineWidth=6;c.strokeStyle='rgba(170,180,255,.16)';c.stroke();c.lineWidth=1.4;c.strokeStyle='rgba(255,255,255,.75)';c.stroke()}
    c.globalCompositeOperation='source-over';
    const R=[],Lf=[];let x=G5.x+84,y=py;while(y<yb){x+=12+r()*26;y+=20+r()*30;R.push([x,y])}x=G5.x-84;y=py;while(y<yb){x-=12+r()*26;y+=20+r()*30;Lf.push([x,y])}
    c.fillStyle=lin(c,0,py,0,yb,[[0,'#f6f8fd'],[.25,'#b3bcdc'],[.7,'#444d7e'],[1,'#1c2250']]);
    c.beginPath();c.moveTo(G5.x-84,py);c.lineTo(G5.x+84,py);R.forEach(q=>c.lineTo(q[0],q[1]));c.lineTo(w+80,yb);c.lineTo(-80,yb);Lf.slice().reverse().forEach(q=>c.lineTo(q[0],q[1]));c.closePath();c.fill();
    c.strokeStyle='rgba(24,30,80,.3)';c.lineWidth=1.2;
    for(let i=0;i<9;i++){let qx=G5.x+(r()-.5)*150,qy=py+4;c.beginPath();c.moveTo(qx,qy);for(let k=0;k<5;k++){qx+=(qx-G5.x)*.22+(r()-.5)*16;qy+=26+r()*24;c.lineTo(qx,qy)}c.stroke()}
    for(let i=0;i<5;i++)cloud(c,w*(.08+r()*.84),yb-170-r()*90,30+r()*22,'rgba(200,206,240,.3)',r);
    for(let i=0;i<7;i++)cloud(c,w*(i/6)+(r()-.5)*30,yb-26-r()*26,44+r()*22,'rgba(226,230,250,.92)',r);
    cloud(c,G5.x-w*.33,py+26,30,'rgba(235,238,252,.75)',r);cloud(c,G5.x+w*.33,py+34,32,'rgba(235,238,252,.75)',r);
  }
];

/* ---------- geometry, canvas, nodes ---------- */
function worldLayout(){
  const w=$('map').clientWidth,h=PAD_T+6*TH+PAD_B,cx=w/2,A=Math.min(w*.3,150);WD.w=w;WD.h=h;
  WD.pts=STOPS.map(S=>{const yb=h-PAD_B-S.t*TH,sg=S.t%2?-1:1;return S.type==='god'?{x:cx,y:yb-340}:{x:cx+sg*A*SWAY[S.k],y:yb-(44+S.k*56)}});
}
function pathTo(c,n){
  const P=WD.pts;c.beginPath();c.moveTo(P[0].x,P[0].y);
  for(let i=0;i<n;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(LAST,i+2)];
    c.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y)}
}
function worldDraw(){
  const cvs=$('mapc'),w=WD.w,h=WD.h,d=Math.min(DPR,2),c=cvs.getContext('2d'),cur=progress();
  if(cvs.width!==Math.round(w*d)||cvs.height!==Math.round(h*d)){cvs.width=Math.round(w*d);cvs.height=Math.round(h*d);cvs.style.height=h+'px'}
  c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,w,h);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  for(let t=0;t<6;t++){const yb=h-PAD_B-t*TH,yt=t===5?0:yb-TH;c.save();c.beginPath();c.rect(0,yt,w,yb-yt);c.clip();SCENE[t](c,w,yt,yb,rng(900+t*13));c.restore()}
  c.fillStyle='#04060b';c.fillRect(0,h-PAD_B,w,PAD_B);
  c.textBaseline='alphabetic';
  for(let t=0;t<6;t++)frieze(c,w,h-PAD_B-t*TH+9,18);

  // the road
  c.lineCap='round';c.lineJoin='round';pathTo(c,LAST);c.lineWidth=10;c.strokeStyle='rgba(3,5,11,.5)';c.stroke();
  c.setLineDash([1,9]);c.lineWidth=3.2;c.strokeStyle='rgba(240,214,150,.6)';c.stroke();c.setLineDash([]);
  if(cur>0){pathTo(c,Math.min(cur,LAST));c.globalCompositeOperation='lighter';c.lineWidth=13;c.strokeStyle='rgba(255,190,90,.24)';c.stroke();c.globalCompositeOperation='source-over';
    c.lineWidth=3.6;c.strokeStyle='#ffe6a8';c.stroke()}
  // shrines
  for(let t=0;t<6;t++){const q=WD.pts[t*6+5],met=!!save.gods[t];temple(c,q.x,q.y+46,150,met,GODS[t].col);
    c.font=`12px ${FONT}`;plaque(c,GODS[t].name.toUpperCase(),q.x+(t%2?13:-13),q.y+69,3.2,t%2?'right':'left',met?'#fff3cf':'rgba(233,196,106,.85)')}
  for(let t=0;t<6;t++){const yb=h-PAD_B-t*TH;c.font=`10.5px ${FONT}`;
    plaque(c,GODS[t].zone.toUpperCase(),t%2?w-19:19,yb-12,2.4,t%2?'right':'left',t<=Math.floor(Math.min(cur,LAST)/6)?'#fff3cf':'rgba(233,196,106,.85)')}
}
function worldNodes(){
  const box=$('nodes');box.textContent='';
  WD.nodes=STOPS.map((S,s)=>{const b=document.createElement('button');b.type='button';b.className='node '+(S.type==='god'?'god':'pz');
    b.style.left=WD.pts[s].x+'px';b.style.top=WD.pts[s].y+'px';b.innerHTML=S.type==='god'?EMB[S.t]:ICON[S.tid];
    if(S.type==='god')b.style.setProperty('--gc',GODS[S.t].col);
    b.addEventListener('click',()=>stopTap(s));box.appendChild(b);return b});
}
function worldParticles(){
  const box=$('mapfxl');box.textContent='';const r=rng(77),h=WD.h,w=WD.w;
  const kinds=[
    {n:9,css:'border:1px solid rgba(220,250,255,.6);',size:[4,9],dy:-170,dx:14,dur:[6,11],o:.7},
    {n:10,css:'background:#ffb060;box-shadow:0 0 8px 2px rgba(255,120,30,.8);',size:[2,4],dy:-190,dx:40,dur:[4,8],o:.9},
    {n:7,css:'background:linear-gradient(90deg,transparent,rgba(225,215,255,.7),transparent);border-radius:0;height:1.5px!important;',size:[36,70],dy:-14,dx:190,dur:[3,6],o:.6,wind:1},
    {n:8,css:'background:#fff7d0;box-shadow:0 0 8px 2px rgba(255,236,160,.85);',size:[2,4],dy:-60,dx:30,dur:[7,12],o:.85},
    {n:8,css:'background:#e4ffb0;box-shadow:0 0 8px 2px rgba(200,255,130,.7);',size:[2,3],dy:-50,dx:60,dur:[6,10],o:.8},
    {n:12,css:'background:#fff;',size:[2,4],dy:170,dx:30,dur:[6,12],o:.8}];
  kinds.forEach((kd,t)=>{const yb=h-PAD_B-t*TH;
    for(let i=0;i<kd.n;i++){const e=document.createElement('span'),sz=kd.size[0]+r()*(kd.size[1]-kd.size[0]);e.className='pt';
      e.style.cssText=`left:${((r()*.9+.05)*w).toFixed(1)}px;top:${(yb-30-r()*(TH-90)).toFixed(1)}px;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;${kd.css}`+
        `--dx:${((kd.wind?.6+r()*.6:r()*2-1)*kd.dx).toFixed(1)}px;--dy:${(kd.dy*(.6+r()*.6)).toFixed(1)}px;--o:${kd.o};animation-duration:${(kd.dur[0]+r()*(kd.dur[1]-kd.dur[0])).toFixed(2)}s;animation-delay:${(-r()*10).toFixed(2)}s`;
      box.appendChild(e)}});
}
function worldSync(){
  const cur=progress();WD.cur=cur;let solved=0,met=0;
  WD.nodes.forEach((b,s)=>{const S=STOPS[s],done=stopDone(s);if(done){if(S.type==='p')solved++;else met++}
    b.classList.toggle('done',done);b.classList.toggle('cur',s===cur);b.classList.toggle('lock',s>cur);
    b.setAttribute('aria-disabled',s>cur?'true':'false');
    b.setAttribute('aria-label',(S.type==='god'?GODS[S.t].name+', '+GODS[S.t].title:TMAP[S.tid].name+', '+GODS[S.t].zone)+(done?(S.type==='god'?', met':', solved'):s===cur?', next':', locked'))});
  $('tally').textContent=cur>=STOPS.length?'The machine is whole':solved+' of 30 solved\n'+met+' of 6 gods met';
  $('replay').textContent='Replay intro';
  const mu=$('mute');mu.classList.toggle('off',save.mute);mu.setAttribute('aria-label',save.mute?'Sound is off':'Sound is on');
}
function markerTo(s,anim){
  const m=$('marker'),q=WD.pts[Math.min(Math.max(s,0),LAST)];m.classList.toggle('high',STOPS[Math.min(s,LAST)].type==='god');
  if(!anim||RM){m.style.transition='none';m.style.transform=`translate(${q.x}px,${q.y}px)`;void m.offsetWidth;m.style.transition=''}
  else m.style.transform=`translate(${q.x}px,${q.y}px)`;
}
let panRaf=0;
function panTo(y,dur){
  cancelAnimationFrame(panRaf);const a=stage.scrollTop,b=cl(y,0,Math.max(0,stage.scrollHeight-stage.clientHeight));
  if(!dur||RM){stage.scrollTop=b;return}
  const s0=performance.now(),stepf=now=>{const k=cl((now-s0)/dur);stage.scrollTop=a+(b-a)*ease(k);if(k<1)panRaf=requestAnimationFrame(stepf)};
  panRaf=requestAnimationFrame(stepf);
}
function centerOn(s,dur){const q=WD.pts[Math.min(Math.max(s,0),LAST)];panTo($('map').offsetTop+q.y-stage.clientHeight*.56,dur)}
['touchstart','wheel','pointerdown'].forEach(ev=>stage.addEventListener(ev,()=>cancelAnimationFrame(panRaf),{passive:true}));
function worldRebuild(){worldLayout();worldNodes();worldParticles();worldDraw();worldSync();markerTo(WD.cur,false);WD.ready=true}
function worldCovers(){if(!WD.ready||WD.w<W-1)return false;const top=$('map').offsetTop-stage.scrollTop;return top<=0&&top+WD.h>=H}

/* ---------- moving through the world ---------- */
function maybeGod(delay){
  const cur=WD.cur;if(cur>=STOPS.length||STOPS[cur].type!=='god')return;
  setTimeout(()=>{if(!scene&&phase>=2&&WD.god<0&&progress()===cur)godOpen(STOPS[cur].t)},delay);
}
function hubOpen(){ // the intro has just handed over
  worldSync();markerTo(WD.cur,false);
  setTimeout(()=>{if(scene||phase<2)return;const q=WD.pts[Math.min(WD.cur,LAST)],target=$('map').offsetTop+q.y-stage.clientHeight*.56;
    const dur=cl(Math.abs(target-stage.scrollTop)*1.15,900,3000);centerOn(WD.cur,dur);maybeGod(dur+500)},1500);
}
function worldArrive(){ // back from a puzzle
  const prev=WD.cur;worldDraw();worldSync();const cur=WD.cur;
  if(prev>=0&&prev!==cur){markerTo(prev,false);centerOn(prev,0);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{markerTo(cur,true);centerOn(cur,950)}));maybeGod(1250)}
  else markerTo(cur,false);
}
function stopTap(s){
  const S=STOPS[s];
  if(s>progress()){const b=WD.nodes[s];b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');sfx('bump');return}
  if(S.type==='god')godOpen(S.t);else enter(S.tid,S.li);
}
function godOpen(t){
  const gd=GODS[t],el=$('god'),first=!save.gods[t];WD.god=t;el.style.setProperty('--gc',gd.col);
  $('godemb').innerHTML=EMB[t];$('godgk').textContent=gd.gk;$('godname').textContent=gd.name;$('godtit').textContent=gd.title;$('godsay').textContent='“'+gd.say+'”';
  $('godgo').textContent=!first?'Return to the road':t===5?'Claim Olympus':'Continue the ascent';
  el.hidden=false;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');sfx('god');
  try{$('godgo').focus({preventScroll:true})}catch(e){}
}
function godClose(){
  const t=WD.god;if(t<0)return;WD.god=-1;const el=$('god'),first=!save.gods[t];el.classList.remove('show');setTimeout(()=>{if(WD.god<0)el.hidden=true},460);
  if(first){save.gods[t]=1;persist();worldDraw();worldSync();markerTo(WD.cur,true);if(WD.cur<STOPS.length)centerOn(WD.cur,950);if(t===5)sfx('win')}
}
$('godgo').addEventListener('click',godClose);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&WD.god>=0)godClose()});
let wrz;window.addEventListener('resize',()=>{clearTimeout(wrz);wrz=setTimeout(()=>{if($('map').clientWidth!==WD.w)worldRebuild()},180)});
worldRebuild();
window.__daedalus={G,LV,Rules,enter,load,leave,input,undo,reset,save,STOPS,WD,progress,stopTap,godOpen,godClose};
})();
